<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Die App lag bis zur Umbenennung unter dieser Adresse und ist dort bereits
     geteilt worden. GitHub Pages kann keine 301 ausliefern, darum dieser Stub:
     canonical bündelt die Signale auf das neue Root, noindex hält die Seite
     aus dem Index, follow gibt die Verlinkung weiter. Kein Script, damit die
     Weiterleitung auch unter der strikten CSP der App funktioniert. -->
<title>SchuhTracker ist umgezogen</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://manuel-steinberg.github.io/RunTrek/">
<meta http-equiv="refresh" content="0; url=./">

<meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
<p class="noscript">
  SchuhTracker liegt jetzt direkt unter
  <a href="./">manuel-steinberg.github.io/RunTrek/</a>.
  Falls die Weiterleitung nicht startet, bitte dem Link folgen.
</p>
</body>
</html>
